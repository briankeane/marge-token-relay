name: Deploy production

on:
  push:
    branches: [main]
  # Manual trigger: bootstrap the first :production image before the Render
  # service exists, or force a rebuild / rollback without a code push.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize production releases so an older run cannot publish the :production
# tag or trigger a deploy after a newer one. A newer push cancels an in-flight
# older run, so the latest commit always wins.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      # Gate publishing on the server checks for this exact commit, so a change
      # that compiles but fails the relay tests is never built or deployed.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Server checks must pass before publishing
        working-directory: server
        run: |
          npm ci
          npm run lint
          npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile.production
          push: true
          tags: |
            ghcr.io/playola-radio/marge-web:production
            ghcr.io/playola-radio/marge-web:${{ github.sha }}

      # Skipped until the Render service exists and its ID is set as a secret,
      # so the first bootstrap run (and build-only dispatches) just builds and
      # pushes the image without failing on a missing service.
      - name: Trigger Render deploy
        if: ${{ env.RENDER_PRODUCTION_SERVICE_ID != '' }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_PRODUCTION_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
